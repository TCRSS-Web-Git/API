openapi: 3.0.3
info:
  title: 'Starter API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
paths:
  /api/v1/login:
    post:
      summary: 'Login (session)'
      operationId: loginsession
      description: 'Authenticates the user'
      parameters: []
      responses: {  }
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: west.vinnie@example.net
                password:
                  type: string
                  description: ''
                  example: MgukS>M
              required:
                - email
                - password
      security: []
  /api/v1/logout:
    post:
      summary: 'Logout (session)'
      operationId: logoutsession
      description: 'Log the user out of the application'
      parameters: []
      responses: {  }
      tags:
        - Authentication
      security: []
  /api/v1/register:
    post:
      summary: 'Handle an incoming registration request.'
      operationId: handleAnIncomingRegistrationRequest
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: ghzieiacbutrr
                last_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: jcqmkjwuffmsavijohwfru
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: kylie.becker@example.org
                password:
                  type: string
                  description: ''
                  example: enim
              required:
                - first_name
                - last_name
                - email
                - password
  /api/v1/forgot-password:
    post:
      summary: 'Handle an incoming password reset link request.'
      operationId: handleAnIncomingPasswordResetLinkRequest
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: mgutkowski@example.com
              required:
                - email
  /api/v1/reset-password:
    post:
      summary: 'Handle an incoming new password request.'
      operationId: handleAnIncomingNewPasswordRequest
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: ''
                  example: in
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: prudence77@example.net
                password:
                  type: string
                  description: ''
                  example: laudantium
              required:
                - token
                - email
                - password
  '/api/v1/verify-email/{id}/{hash}':
    get:
      summary: "Mark the authenticated user's email address as verified."
      operationId: markTheAuthenticatedUsersEmailAddressAsVerified
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the verify email.'
        example: illo
        required: true
        schema:
          type: string
      -
        in: path
        name: hash
        description: ''
        example: officiis
        required: true
        schema:
          type: string
  /api/v1/email/verification-notification:
    post:
      summary: 'Send a new email verification notification.'
      operationId: sendANewEmailVerificationNotification
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
  /api/v1/csrf-cookie:
    get:
      summary: 'Return an empty response simply to trigger the storage of the CSRF cookie in the browser.'
      operationId: returnAnEmptyResponseSimplyToTriggerTheStorageOfTheCSRFCookieInTheBrowser
      description: ''
      parameters: []
      responses:
        204:
          description: ''
      tags:
        - Endpoints
  /api/v1/dev-api:
    get:
      summary: ''
      operationId: getApiV1DevApi
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'this is dev environtment'
                properties:
                  message:
                    type: string
                    example: 'this is dev environtment'
      tags:
        - Endpoints
  /api/v1/user:
    get:
      summary: 'Get authenticated user profile'
      operationId: getAuthenticatedUserProfile
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Users
  /api/v1/users:
    get:
      summary: 'Get All Users'
      operationId: getAllUsers
      description: ''
      parameters:
        -
          in: query
          name: sort
          description: 'Data field(s) to sort by. Separate multiple fields with commas. Denote descending sort with a minus sign.'
          example: 'title,-createdAt'
          required: false
          schema:
            type: string
            description: 'Data field(s) to sort by. Separate multiple fields with commas. Denote descending sort with a minus sign.'
            example: 'title,-createdAt'
        -
          in: query
          name: 'filter[search]'
          description: 'Search user by name, email.'
          example: perferendis
          required: false
          schema:
            type: string
            description: 'Search user by name, email.'
            example: perferendis
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Users
    post:
      summary: 'Create User'
      operationId: createUser
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'ข้อมูล value ต้องยาวไม่เกิน 255 ตัวอักษร.'
                  example: midblojdznewezlsvylwy
                email:
                  type: string
                  description: 'ข้อมูล value ต้องเป็นอีเมล ข้อมูล value ต้องยาวไม่เกิน 255 ตัวอักษร.'
                  example: melisa.hoeger@example.net
                role_id:
                  type: string
                  description: ''
                  example: quis
                password:
                  type: string
                  description: 'ข้อมูล value ต้องยาวอย่างน้อย 8 ตัวอักษร.'
                  example: '/JQJ:P"fJ2n*3X'
              required:
                - name
                - email
                - role_id
                - password
  '/api/v1/users/{id}':
    get:
      summary: 'Get User by ID'
      operationId: getUserByID
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Users
    put:
      summary: 'Update User'
      operationId: updateUser
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'ข้อมูล value ต้องยาวไม่เกิน 255 ตัวอักษร.'
                  example: klspuoycelcjbjxl
                email:
                  type: string
                  description: 'ข้อมูล value ต้องเป็นอีเมล ข้อมูล value ต้องยาวไม่เกิน 255 ตัวอักษร.'
                  example: bridgette.batz@example.org
                role_id:
                  type: string
                  description: ''
                  example: quasi
                password:
                  type: string
                  description: 'ข้อมูล value ต้องยาวอย่างน้อย 8 ตัวอักษร.'
                  example: MVNU3qe
              required:
                - name
                - email
                - role_id
                - password
    delete:
      summary: 'Delete User'
      operationId: deleteUser
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Users
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the user.'
        example: 1
        required: true
        schema:
          type: integer
tags:
  -
    name: Authentication
    description: ''
  -
    name: Endpoints
    description: ''
  -
    name: Users
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
